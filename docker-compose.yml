version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: moviedb_postgres
    environment:
      POSTGRES_DB: moviedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - moviedb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moviedb_backend
    environment:
      - DATABASE_URL=postgresql://postgres:password_change_me@db:5432/moviedb
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /home/bbrodge/MyMovieDB/movies:/movies
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moviedb-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moviedb_frontend
    ports:
      - "3000:80"
      # For SSL support: uncomment line below (redirects HTTP port 80 to HTTPS port 443)
      # - "443:443"
    # For SSL support: uncomment volumes below and provide paths to your certificates
    # volumes:
    #   - /path/to/certs/directory:/etc/nginx/ssl:ro
    #   - ./frontend/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - moviedb-net
    restart: unless-stopped

networks:
  moviedb-net:
    driver: bridge

volumes:
  pgdata:
